name: hola-mundo

on:
    push:
        branches: ["aprendiendo-github-actions"]

jobs:
    hola-mundo:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Variable
              run: echo "USERNAME=${{ github.actor }}" >> $GITHUB_ENV 
            - name: hola-mundo
              run: python3 hola_mundo.py

    
    
